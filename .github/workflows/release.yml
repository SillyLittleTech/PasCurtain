name: Build & Release

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'web/**'
      - 'linux/**'
      - 'macos/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Determine version from pubspec.yaml
  # ────────────────────────────────────────────────────────────────────────────
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      build_number: ${{ steps.get_version.outputs.build_number }}
      tag: ${{ steps.get_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          BUILD=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}+${BUILD}" >> "$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────────────────────────
  # Build Linux
  # ────────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libssl-dev

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Ensure Linux platform files
        run: flutter create --platforms=linux .

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build Linux release
        run: |
          flutter clean
          flutter build linux --release

      - name: Package Linux build
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../pascurtain-linux-x64.tar.gz .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: pascurtain-linux-x64.tar.gz
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # Build Windows
  # ────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Ensure Windows platform files
        run: flutter create --platforms=windows .

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath pascurtain-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: pascurtain-windows-x64.zip
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # Build macOS
  # ────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Ensure macOS platform files
        run: flutter create --platforms=macos .

      - name: Get Flutter packages
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod repo update

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package macOS build
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../pascurtain-macos.zip PasCurtain.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: pascurtain-macos.zip
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # Build Web (PWA) & deploy to GitHub Pages
  # ────────────────────────────────────────────────────────────────────────────
  build-web:
    name: Build Web (PWA)
    runs-on: ubuntu-latest
    needs: version
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build web release
        run: |
          flutter build web --release \
            --base-href "/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # ────────────────────────────────────────────────────────────────────────────
  # Create GitHub Release
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - version
      - build-linux
      - build-windows
      - build-macos
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "PasCurtain ${{ env.VERSION }} (build ${{ env.BUILD_NUMBER }})"
          body: |
            ## PasCurtain v${{ env.VERSION }}+${{ env.BUILD_NUMBER }}

            Automated release built from commit ${{ github.sha }}.

            ### Downloads
            | Platform | File |
            |----------|------|
            | 🐧 Linux (x64) | `pascurtain-linux-x64.tar.gz` |
            | 🪟 Windows (x64) | `pascurtain-windows-x64.zip` |
            | 🍎 macOS | `pascurtain-macos.zip` |
            | 🌐 Web (PWA) | Deployed to GitHub Pages |

            ### What's new
            See the [commit history](https://github.com/${{ github.repository }}/commits/main) for details.
          prerelease: false
          files: |
            artifacts/linux-build/pascurtain-linux-x64.tar.gz
            artifacts/windows-build/pascurtain-windows-x64.zip
            artifacts/macos-build/pascurtain-macos.zip
          generate_release_notes: true
