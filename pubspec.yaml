name: pas_curtain
description: PasCurtain — a multiplatform password and email breach checker using the pwnedpasswords API with secure password suggestions.
publish_to: 'none'

version: 1.2.3+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  crypto: ^3.0.3
  provider: ^6.1.2
  shared_preferences: ^2.3.0
  flutter_svg: ^2.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
